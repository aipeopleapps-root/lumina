name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'lambdas/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'lambdas/**'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up QEMU (ARM64 emulation for Lambda bundling)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci

      - name: CDK Diff (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          cd infra
          npx cdk diff

      - name: Wait for CloudFormation stack to be stable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name WorkdayAiPlatformStack \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Stack status: $STATUS"

          if [[ "$STATUS" == "UPDATE_IN_PROGRESS" || "$STATUS" == "UPDATE_COMPLETE_CLEANUP_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-update-complete --stack-name WorkdayAiPlatformStack || true
          elif [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete --stack-name WorkdayAiPlatformStack || true
          elif [[ "$STATUS" == *"ROLLBACK"* ]]; then
            aws cloudformation wait stack-rollback-complete --stack-name WorkdayAiPlatformStack || true
          fi

      - name: Detect change type
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changetype
        run: |
          # Use hotswap when only lambda code changed (no infra changes)
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^infra/'; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=hotswap" >> $GITHUB_OUTPUT
          fi

      - name: CDK Deploy — hotswap (Lambda-only changes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changetype.outputs.mode == 'hotswap'
        run: |
          cd infra
          npx cdk deploy --hotswap-fallback --require-approval never

      - name: CDK Deploy — full (infrastructure changes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changetype.outputs.mode == 'full'
        run: |
          cd infra
          npx cdk deploy --require-approval never
