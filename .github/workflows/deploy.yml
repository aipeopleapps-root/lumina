name: Deploy Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up QEMU (ARM64 emulation for Lambda bundling)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install CDK dependencies
        run: |
          cd infra
          npm install
      
      - name: CDK Diff (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          cd infra
          npx cdk diff
      
      - name: Wait for CloudFormation stack to be stable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for stack to reach a stable state..."
          aws cloudformation wait stack-exists --stack-name WorkdayAiPlatformStack 2>/dev/null || true
          for i in {1..30}; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name WorkdayAiPlatformStack \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "Stack status: $STATUS"
            if [[ "$STATUS" == *"IN_PROGRESS"* ]]; then
              echo "Stack busy, waiting 30s..."
              sleep 30
            else
              echo "Stack ready."
              break
            fi
          done

      - name: CDK Deploy (Main Branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd infra
          npx cdk deploy --require-approval never
